<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso RF - Depósito</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 16px; box-sizing: border-box;}
        button { background: #4CAF50; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:active { background: #388E3C; }
        label { font-size: 14px; color: #b0b0b0; display: block; margin-top: 10px; }
        .highlight { border: 2px solid #4CAF50; }
        .loading { text-align: center; color: #FF9800; font-weight: bold; margin-bottom: 10px; }
        .disabled-section { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body>

    <h2>Registro de Ingresos RF</h2>

    <div id="loadingMsg" class="loading">Cargando base de datos de OCs...</div>

    <!-- 1. Paso 1: Número de OC -->
    <div class="card">
        <label><b>1. Número de OC:</b></label>
        <input type="text" id="inputOC" list="listaOCs" placeholder="Tipeá o seleccioná la OC..." oninput="seleccionarOC()" onchange="seleccionarOC()">
        <datalist id="listaOCs"></datalist>
    </div>

    <!-- 2. Paso 2: Código de Artículo -->
    <div class="card disabled-section" id="seccionCodigo">
        <label><b>2. Código de Artículo:</b></label>
        <input type="text" id="inputCodigo" list="listaCodigos" placeholder="Tipeá o escaneá el código..." oninput="filtrarPorCodigo()" onchange="filtrarPorCodigo()">
        <datalist id="listaCodigos"></datalist>
    </div>

    <!-- 3. Paso 3: Selectores -->
    <div class="card disabled-section" id="seccionSelecciones">
        <label><b>Seleccionar Partida:</b></label>
        <select id="selectPartida" onchange="filtrarPorSelectores()">
            <option value="">-- Seleccioná la Partida --</option>
        </select>

        <label><b>Seleccionar IRC:</b></label>
        <select id="selectIrc" onchange="filtrarPorSelectores()">
            <option value="">-- Seleccioná el IRC --</option>
        </select>

        <label><b>Seleccionar Nro. de Línea:</b></label>
        <select id="selectLinea" onchange="filtrarPorSelectores()">
            <option value="">-- Seleccioná la Línea --</option>
        </select>

        <label><b>Seleccionar Lote / Renglón:</b></label>
        <select id="selectLoteItem" onchange="cargarDatosFinales()">
            <option value="">-- Seleccioná el lote/renglón --</option>
        </select>
    </div>

    <!-- 4. Paso 4: Cantidad y ID RF -->
    <div class="card disabled-section" id="seccionConfirmacion">
        <label>Lote (Editable / Vacío si es bolso):</label>
        <input type="text" id="txtLote" placeholder="Número de lote">

        <label>Cantidad:</label>
        <input type="number" id="txtCantidad" placeholder="Cantidad física">

        <label><b>ID RF:</b></label>
        <input type="text" id="txtIdRf" class="highlight" placeholder="Escribí o escaneá la etiqueta ID RF...">

        <button onclick="enviarAlSheets()">CONFIRMAR Y ENVIAR</button>
    </div>

    <script>
        let baseDatos = [];
        let itemsDeOCActual = [];
        let itemSeleccionadoActual = null;
       
        // URL de tu Webhook de Make
        const URL_WEBHOOK = "https://hook.us2.make.com/a31zyxxicics3loy1p2p8q1b7ga8fcq4";

        function getVal(item, keys) {
            for (let k of keys) {
                let encontrada = Object.keys(item).find(prop => prop.toUpperCase() === k.toUpperCase());
                if (encontrada && item[encontrada] !== undefined && item[encontrada] !== null) {
                    return item[encontrada];
                }
            }
            return "";
        }

        window.onload = function() {
            // Nota: Si la lectura inicial de datos sigue dependiendo del Apps Script anterior, 
            // asegúrate de mantener esa URL aquí si la necesitas para cargar el listado de OCs.
            const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxcZtRJg_aNe54aPyiraHVPIZIBlABb7cwtJ2bX8bY1P-wnWEdVpsMNB4ewdukkEfi0/exec";

            fetch(URL_APPS_SCRIPT)
            .then(res => res.json())
            .then(data => {
                baseDatos = data;
                console.log("Ejemplo de fila recibida (revisá los nombres de columna):", data[0]);
                let ocsUnicas = [...new Set(data.map(i => String(getVal(i, ['OC']))).filter(x => x !== ""))];
                let datalist = document.getElementById("listaOCs");
                datalist.innerHTML = "";
               
                ocsUnicas.forEach(oc => {
                    let opt = document.createElement("option");
                    opt.value = oc;
                    datalist.appendChild(opt);
                });
                document.getElementById("loadingMsg").style.display = "none";
            })
            .catch(err => {
                document.getElementById("loadingMsg").innerText = "Error al cargar los datos. Verificá la URL.";
                document.getElementById("loadingMsg").style.color = "#FF5252";
            });
        };

        function seleccionarOC() {
            let ocBuscada = document.getElementById("inputOC").value.trim();
            itemsDeOCActual = baseDatos.filter(i => String(getVal(i, ['OC'])).trim() === String(ocBuscada));

            document.getElementById("inputCodigo").value = "";
            limpiarSelectsYCampos();

            document.getElementById("seccionCodigo").classList.add("disabled-section");
            document.getElementById("seccionSelecciones").classList.add("disabled-section");
            document.getElementById("seccionConfirmacion").classList.add("disabled-section");

            if (itemsDeOCActual.length > 0) {
                document.getElementById("seccionCodigo").classList.remove("disabled-section");
                let codigosUnicos = [...new Set(itemsDeOCActual.map(i => String(getVal(i, ['CODIGO']))).filter(x => x !== ""))];
                let datalistCod = document.getElementById("listaCodigos");
                datalistCod.innerHTML = "";
                codigosUnicos.forEach(cod => {
                    let opt = document.createElement("option");
                    opt.value = cod;
                    datalistCod.appendChild(opt);
                });
            }
        }

        function filtrarPorCodigo() {
            let codigoBuscado = document.getElementById("inputCodigo").value.trim();
            limpiarSelectsYCampos();
            document.getElementById("seccionConfirmacion").classList.add("disabled-section");

            let coincidencias = itemsDeOCActual.filter(i => String(getVal(i, ['CODIGO'])).trim().toLowerCase() === String(codigoBuscado).toLowerCase());

            if (coincidencias.length > 0) {
                document.getElementById("seccionSelecciones").classList.remove("disabled-section");

                let selPartida = document.getElementById("selectPartida");
                let selIrc = document.getElementById("selectIrc");
                let selLinea = document.getElementById("selectLinea");
                let selLoteItem = document.getElementById("selectLoteItem");

                let partidasUnicas = [...new Set(coincidencias.map(i => String(getVal(i, ['PARTIDA']))).filter(x => x !== ""))];
                partidasUnicas.forEach(val => {
                    let opt = document.createElement("option");
                    opt.value = val;
                    opt.text = val;
                    selPartida.appendChild(opt);
                });
                if (partidasUnicas.length === 1) selPartida.value = partidasUnicas[0];

                let ircsUnicos = [...new Set(coincidencias.map(i => String(getVal(i, ['IRC']))).filter(x => x !== ""))];
                ircsUnicos.forEach(val => {
                    let opt = document.createElement("option");
                    opt.value = val;
                    opt.text = val;
                    selIrc.appendChild(opt);
                });
                if (ircsUnicos.length === 1) selIrc.value = ircsUnicos[0];

                let lineasUnicas = [...new Set(coincidencias.map(i => String(getVal(i, ['LINEA', 'NRO_LINEA']))).filter(x => x !== ""))];
                lineasUnicas.forEach(val => {
                    let opt = document.createElement("option");
                    opt.value = val;
                    opt.text = val;
                    selLinea.appendChild(opt);
                });
                if (lineasUnicas.length === 1) selLinea.value = lineasUnicas[0];

                coincidencias.forEach((item, index) => {
                    let opt = document.createElement("option");
                    opt.value = index;
                    let loteVal = getVal(item, ['LOTE']);
                    let cantVal = getVal(item, ['CANTIDAD']);
                    let descLote = loteVal ? `Lote: ${loteVal}` : `Sin Lote (Bolso)`;
                    opt.text = `${descLote} | Cant: ${cantVal}`;
                    selLoteItem.appendChild(opt);
                });

                // Guardamos la base completa (por código) para poder re-filtrar
                // cada vez que se cambie Partida, IRC o Línea.
                window.coincidenciasPorCodigo = coincidencias;
                window.coincidenciasActuales = coincidencias;

                if (coincidencias.length === 1) {
                    selLoteItem.value = "0";
                    cargarDatosFinales();
                }
            } else {
                document.getElementById("seccionSelecciones").classList.add("disabled-section");
            }
        }

        function filtrarPorSelectores() {
            let partida = document.getElementById("selectPartida").value;
            let irc = document.getElementById("selectIrc").value;
            let linea = document.getElementById("selectLinea").value;

            let base = window.coincidenciasPorCodigo || [];

            let filtrados = base.filter(item => {
                let okPartida = !partida || String(getVal(item, ['PARTIDA'])).trim() === partida;
                let okIrc = !irc || String(getVal(item, ['IRC'])).trim() === irc;
                let okLinea = !linea || String(getVal(item, ['LINEA', 'NRO_LINEA'])).trim() === linea;
                return okPartida && okIrc && okLinea;
            });

            let selLoteItem = document.getElementById("selectLoteItem");
            selLoteItem.innerHTML = '<option value="">-- Seleccioná el lote/renglón --</option>';
            document.getElementById("txtLote").value = "";
            document.getElementById("txtCantidad").value = "";
            document.getElementById("txtIdRf").value = "";
            itemSeleccionadoActual = null;
            document.getElementById("seccionConfirmacion").classList.add("disabled-section");

            filtrados.forEach((item, index) => {
                let opt = document.createElement("option");
                opt.value = index;
                let loteVal = getVal(item, ['LOTE']);
                let cantVal = getVal(item, ['CANTIDAD']);
                let descLote = loteVal ? `Lote: ${loteVal}` : `Sin Lote (Bolso)`;
                opt.text = `${descLote} | Cant: ${cantVal}`;
                selLoteItem.appendChild(opt);
            });

            window.coincidenciasActuales = filtrados;

            if (filtrados.length === 1) {
                selLoteItem.value = "0";
                cargarDatosFinales();
            }
        }

        function limpiarSelectsYCampos() {
            document.getElementById("selectPartida").innerHTML = '<option value="">-- Seleccioná la Partida --</option>';
            document.getElementById("selectIrc").innerHTML = '<option value="">-- Seleccioná el IRC --</option>';
            document.getElementById("selectLinea").innerHTML = '<option value="">-- Seleccioná la Línea --</option>';
            document.getElementById("selectLoteItem").innerHTML = '<option value="">-- Seleccioná el lote/renglón --</option>';
            document.getElementById("txtLote").value = "";
            document.getElementById("txtCantidad").value = "";
            document.getElementById("txtIdRf").value = "";
            itemSeleccionadoActual = null;
        }

        function cargarDatosFinales() {
            let idx = document.getElementById("selectLoteItem").value;
            if(idx === "") {
                document.getElementById("seccionConfirmacion").classList.add("disabled-section");
                return;
            }

            itemSeleccionadoActual = window.coincidenciasActuales[idx];

            document.getElementById("txtLote").value = getVal(itemSeleccionadoActual, ['LOTE']);
            document.getElementById("txtCantidad").value = getVal(itemSeleccionadoActual, ['CANTIDAD']);
           
            let valPartida = String(getVal(itemSeleccionadoActual, ['PARTIDA'])).trim();
            if(valPartida) document.getElementById("selectPartida").value = valPartida;

            let valIrc = String(getVal(itemSeleccionadoActual, ['IRC'])).trim();
            if(valIrc) document.getElementById("selectIrc").value = valIrc;

            let valLinea = String(getVal(itemSeleccionadoActual, ['LINEA', 'NRO_LINEA'])).trim();
            if(valLinea) document.getElementById("selectLinea").value = valLinea;

            document.getElementById("seccionConfirmacion").classList.remove("disabled-section");
            document.getElementById("txtIdRf").focus();
        }

        function resetearParaSiguienteItem() {
            // Mantiene la OC actual (inputOC e itemsDeOCActual intactos)
            // y limpia todo lo demás para cargar el próximo artículo/lote.
            document.getElementById("inputCodigo").value = "";

            limpiarSelectsYCampos();

            document.getElementById("seccionSelecciones").classList.add("disabled-section");
            document.getElementById("seccionConfirmacion").classList.add("disabled-section");

            document.getElementById("inputCodigo").focus();
        }

        function enviarAlSheets() {
            let idrf = document.getElementById("txtIdRf").value.trim();
            let loteEditado = document.getElementById("txtLote").value.trim();
            let cantidadEditada = document.getElementById("txtCantidad").value;

            if(!itemSeleccionadoActual) {
                alert("Faltan datos por seleccionar.");
                return;
            }
            if(!idrf) {
                alert("El campo ID RF es obligatorio.");
                document.getElementById("txtIdRf").focus();
                return;
            }

            let payload = {
                oc: getVal(itemSeleccionadoActual, ['OC']),
                idrf: idrf,
                codigo: getVal(itemSeleccionadoActual, ['CODIGO']),
                lote: loteEditado,
                cantidad: cantidadEditada,
                irc: document.getElementById("selectIrc").value,
                partida: document.getElementById("selectPartida").value,
                linea: document.getElementById("selectLinea").value
            };

            let btn = event.target;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            // Envío adaptado para Webhook de Make con cabecera de texto plano para evitar bloqueos CORS
            fetch(URL_WEBHOOK, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(payload)
            }).then(() => {
                alert("¡Registrado correctamente!");
                btn.innerText = "CONFIRMAR Y ENVIAR";
                btn.disabled = false;
                resetearParaSiguienteItem();
            }).catch(err => {
                alert("Error al enviar: " + err);
                btn.innerText = "CONFIRMAR Y ENVIAR";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
